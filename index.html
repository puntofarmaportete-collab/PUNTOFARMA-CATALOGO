/* PuntoFarma — desplazamiento táctil continuo en pantallas de colaboradores.
   Usar desplazamiento nativo de la página, sin listas internas que atrapen el gesto. */
@media (max-width: 920px), (hover: none) and (pointer: coarse) {
  html { height: auto; min-height: 100%; overflow-x: clip; overflow-y: auto !important; scroll-behavior: auto; overscroll-behavior-y: auto; }
  body { height: auto; min-height: 100dvh; overflow-x: clip; overflow-y: visible !important; overscroll-behavior-y: auto; -webkit-overflow-scrolling: touch; }
  #app { min-height: 100dvh; height: auto; overflow-y: visible; }
  .worker-shell, .worker-shell.recount-shell { min-height: 100dvh; height: auto; overflow-y: visible !important; touch-action: pan-y; padding-bottom: max(76px, calc(38px + env(safe-area-inset-bottom))); }
  .worker-shell .worker-cols, .worker-shell .recount-cols,
  .worker-shell .count-form, .worker-shell .surface, .worker-shell .my-counts,
  .worker-shell .recount-items { height: auto; min-height: 0; overflow-y: visible; touch-action: pan-y; }
  .worker-shell .my-counts, .worker-shell .recount-items { max-height: none; overflow: visible; }
  .worker-shell .suggestions { overscroll-behavior-y: auto !important; -webkit-overflow-scrolling: touch; touch-action: pan-y; }
  .worker-shell input, .worker-shell button, .worker-shell select { touch-action: manipulation; }
}

 async applyTheoryUpdate(ps,onProgress){
   const {db,fsm}=fb;
   if(STORE.role!=='supervisor'||!STORE.ready||!STORE.connected)throw Error('Se requiere supervisión con Firebase conectado.');
   // Re-check stock immediately before updating to prevent overwriting a supervisor's concurrent corrections.
   const originals=new Map(STORE.products.map(p=>[p.id,p]));
   const existing=ps.filter(p=>originals.has(p.id));
   for(let i=0;i<existing.length;i+=20){
     await Promise.all(existing.slice(i,i+20).map(async p=>{
       const previous=originals.get(p.id),snap=await fsm.getDoc(fsm.doc(db,'stock',p.id));
       if(!snap.exists()||Number(snap.data().theoretical||0)!==Number(previous.theoretical||0))
         throw Error('El teórico de '+p.code+' cambió desde la vista previa. Repite la comparación.');
     }));
   }
   let finished=0;
   for(let i=0;i<ps.length;i+=125){const batch=fsm.writeBatch(db);
     for(const p of ps.slice(i,i+125)){
       batch.set(fsm.doc(db,'catalog',p.id),publicProduct(p));
       const {id,code,name,category,presentation,unitsPerPresentation,...stock}=cleanSku(p);
       batch.set(fsm.doc(db,'stock',id),stock);

     }
     if(i+125>=ps.length)batch.set(fsm.doc(db,'catalog',SYNC_DOC),{version:strId(),updatedAt:now(),kind:'catalog',action:'full',ids:[]});
     await batch.commit();finished+=Math.min(125,ps.length-i);onProgress?.(finished,ps.length);
   }

 async queueRecounts(tasks){
  const {fsm,db}=fb;
  let created=0,already=0,failed=0;
  const confirmed=[];
  let firstFailure='';
  // La transacción garantiza que dos supervisores no creen el mismo reconteo.
  for(let i=0;i<tasks.length;i+=6){
    const group=tasks.slice(i,i+6);
    const results=await Promise.allSettled(group.map(async t=>{
      const ref=fsm.doc(db,'recounts',t.skuId);
      return fsm.runTransaction(db,async tx=>{
        const snap=await tx.get(ref);
        if(snap.exists())return {created:false,existing:{skuId:t.skuId,...snap.data()}};
        tx.set(ref,t);
        return {created:true};
      });
    }));
    results.forEach((r,n)=>{
      if(r.status==='rejected'){
        failed++;
        if(!firstFailure)firstFailure=r.reason?.message||'Error de Firebase';
      }else if(r.value?.created){created++;confirmed.push(group[n])}
      else {already++;if(r.value?.existing)confirmed.push(r.value.existing)};
    });
  }
  // Tras confirmar la escritura, mover inmediatamente a la cola de reconteos.
  // No modifica el catálogo, el stock teórico ni el primer conteo.
  for(const t of confirmed){
    if(!STORE.recounts.some(x=>x.skuId===t.skuId))STORE.recounts.push({...t});
  }
  if(failed)throw Error(`${created} código(s) enviados, ${failed} sin enviar. ${firstFailure}. Revisa «Reconteos enviados» antes de reintentar.`);
  return {created,already,failed};

 async deleteRecountEntry(id){const e=STORE.recountEntries.find(x=>x.id===id),t=STORE.recounts.find(x=>x.skuId===e?.skuId);if(!e||e.uid!==STORE.uid||t?.status!=='in_progress'||t.assignedUid!==STORE.uid||t.attemptId!==e.attemptId)throw Error('No puedes borrar este registro.');await fb.fsm.deleteDoc(fb.fsm.doc(fb.db,'recount_entries',id))},
 async finishRecount(skuId){const {fsm,db}=fb;const owned=await fsm.getDocs(fsm.query(fsm.collection(db,'recount_entries'),fsm.where('uid','==',STORE.uid)));if(!owned.docs.some(x=>x.data().skuId===skuId&&x.data().attemptId===STORE.recounts.find(t=>t.skuId===skuId)?.attemptId))throw Error('Primero guarda al menos un registro de reconteo.');const ref=fsm.doc(db,'recounts',skuId);await fsm.runTransaction(db,async tx=>{const snap=await tx.get(ref);if(!snap.exists()||snap.data().status!=='in_progress'||snap.data().assignedUid!==STORE.uid)throw Error('Este código ya no está reservado para ti.');tx.update(ref,{status:'completed',completedAt:now(),updatedAt:now()})})},
 async resetData(mode){
   if(STORE.role!=='supervisor'||!fb.auth.currentUser||!STORE.connected)throw Error('Se requiere Supervisión conectada a Firebase.');
   const {fsm,db}=fb;
   const purge=async(names)=>{
     let deleted=0;
     for(const name of names){
       const list=await fsm.getDocs(fsm.collection(db,name));
       for(let i=0;i<list.docs.length;i+=200){const batch=fsm.writeBatch(db);
         list.docs.slice(i,i+200).forEach(ref=>batch.delete(ref.ref));
         await batch.commit();deleted+=Math.min(200,list.docs.length-i);
       }
     }
     return deleted;
   };
   if(mode==='counts')return purge(['recount_entries','recounts','counts','markers','surplus']);
   if(mode==='catalog'){
     const rows=await fsm.getDocs(fsm.query(fsm.collection(db,'counts'),fsm.limit(1)));
     if(!rows.empty)throw Error('Aún hay conteos. Bórralos primero o utiliza Reiniciar todo.');
     return purge(['recount_entries','recounts','markers','stock','catalog']);
   }
   if(mode==='all'){
     let deleted=await purge(['recount_entries','recounts','counts','markers','surplus','stock','catalog']);
     // Reinicio de pruebas: también limpia las sesiones de colaboradores; conserva supervisores.
     const profiles=await fsm.getDocs(fsm.collection(db,'profiles'));
     const operators=profiles.docs.filter(doc=>doc.data().role==='operator');
     for(let i=0;i<operators.length;i+=200){
       const batch=fsm.writeBatch(db);
       operators.slice(i,i+200).forEach(doc=>batch.delete(doc.ref));
       await batch.commit();deleted+=Math.min(200,operators.length-i);
     }
     return deleted;
   }
   throw Error('Opción de borrado desconocida.');
 },
 async loadLocations(force=false){
  if(locationLoadPending)return locationLoadPending;
  const cache=readCache('locations');
  if(!force&&cache&&Array.isArray(cache.rows)&&Date.now()-Number(cache.at||0)<LOCATIONS_CACHE_AGE_MS){
   STORE.locations=cache.rows;STORE.locationsLoaded=true;STORE.locationsSyncedAt=Number(cache.at||0);scheduleRender();return;
  }
  // Evitar refrescos compulsivos: una lectura de la colección puede cobrar por documento.
  if(force&&STORE.locationsLoaded&&locationRemoteFetchedAt&&Date.now()-locationRemoteFetchedAt<LOCATIONS_REFRESH_GAP_MS){
   scheduleRender();return;
  }
  locationLoadPending=(async()=>{
   const {fsm,db}=fb;
   const snaps=await fsm.getDocs(fsm.collection(db,'locations'));
   const stamp=Date.now();
   STORE.locations=snaps.docs.map(d=>({skuId:d.id,...d.data()}));
   STORE.locationsLoaded=true;STORE.locationsSyncedAt=stamp;locationRemoteFetchedAt=stamp;
   writeCache('locations',{rows:STORE.locations,at:stamp});scheduleRender();
  })();
  try{return await locationLoadPending}finally{locationLoadPending=null}
 },
 async saveLocation(skuId,location,expectedUpdatedAt){
  const {fsm,db}=fb; const ref=fsm.doc(db,'locations',skuId);
  const result=await fsm.runTransaction(db,async tx=>{
   const snap=await tx.get(ref),current=snap.exists()?snap.data():null;
   if(String(current?.updatedAt||'')!==String(expectedUpdatedAt||''))throw Error('Otro colaborador cambió la ubicación. Pulsa Actualizar para revisar antes de guardar.');
   const doc={skuId,location,uid:STORE.uid,name:STORE.user.displayName,updatedAt:now()};
   tx.set(ref,doc);return doc;
  });
  STORE.locations=STORE.locations.filter(x=>x.skuId!==skuId).concat(result);
  writeCache('locations',{rows:STORE.locations,at:Date.now()});
  return result;
 },
 async deleteLocation(skuId,expectedUpdatedAt){
  const {fsm,db}=fb,ref=fsm.doc(db,'locations',skuId);
  await fsm.runTransaction(db,async tx=>{
   const snap=await tx.get(ref);
   if(!snap.exists())throw Error('Esta ubicación ya fue eliminada. Pulsa Actualizar.');
   if(String(snap.data().updatedAt||'')!==String(expectedUpdatedAt||''))throw Error('Otro colaborador modificó esta ubicación. Pulsa Actualizar antes de eliminar.');
   tx.delete(ref);
  });
  STORE.locations=STORE.locations.filter(x=>x.skuId!==skuId);
  writeCache('locations',{rows:STORE.locations,at:Date.now()});
 },
 async start(role,uid){
  const {fsm,db}=fb;
  unsub.forEach(f=>f());unsub=[];refreshMarkerProgress=null;refreshSupervisorFeeds=null;
  STORE.products=[];STORE.counts=[];STORE.surplus=[];STORE.markers=[];STORE.recounts=[];STORE.recountEntries=[];STORE.profiles=[];STORE.locations=[];STORE.locationsLoaded=false;STORE.locationsSyncedAt=0;
  STORE.ready=false;STORE.connected=false;STORE.syncIssue=null;STORE.progressReady=false;
  const received=new Set(),reported=new Set();
  // Los catálogos y el stock cambian poco: ya NO dejamos escuchas en vivo de
  // cientos de documentos. Una señal de un documento anuncia cuándo refrescar.
  const required=role==='supervisor'?['catalog','stock','counts']:
                 role==='recount'?['catalog','recounts']:
                 role==='locations'?['catalog']:
                 ['catalog','counts'];
  let syncTimer=null, sessionStopped=false, lastCatalogVersion=null, catalogVersionSeen=false;
  let refreshingCatalog=Promise.resolve(), refreshBusy=false;
  const friendly=(key,e)=>{
    const raw=String(e?.message||e||'Error de conexión');
    const desc=key==='stock'?'existencias teóricas':key==='catalog'?'catálogo':
      key==='counts'?'conteos':key==='markers'?'avance':
      key==='recounts'?'cola de reconteo':key==='recount_entries'?'registros de reconteo':
      key==='surplus'?'sobrantes':key==='profiles'?'perfiles':key==='locations'?'ubicaciones':key;
    return (e?.code==='permission-denied'||raw.includes('permission'))?
      `Sin permiso de Firestore para ${desc}. Revisa las reglas de ese módulo. No se ha eliminado ningún conteo.`:
      `No se pudo consultar ${desc}: ${raw}`;
  };
  const setFailure=message=>{
    if(sessionStopped)return;
    clearTimeout(syncTimer);
    STORE.syncIssue=message;
    STORE.ready=false;STORE.connected=false;
    render();
  };
  const updateReady=()=>{
    if(sessionStopped||STORE.syncIssue)return;
    const ready=required.every(k=>received.has(k));
    STORE.ready=ready;STORE.connected=ready;
    if(ready)clearTimeout(syncTimer);
    scheduleRender();
  };
  syncTimer=setTimeout(()=>{
    if(sessionStopped||STORE.ready||STORE.syncIssue)return;
    const missing=required.filter(k=>!received.has(k));
    setFailure(`Firebase no terminó de responder después de 20 segundos. Falta sincronizar: ${missing.join(', ')}. Comprueba la conexión o vuelve a intentarlo.`);
  },20000);
  const watch=(key,ref,fn)=>{
    try{
      const stop=fsm.onSnapshot(ref,snap=>{
        if(sessionStopped||STORE.syncIssue)return;
        fn(snap.docs.map(d=>({id:d.id,...d.data()})));
        received.add(key);
        updateReady();
      },e=>{
        if(sessionStopped)return;
        console.error('PuntoFarma Firebase / '+key,e);
        const message=friendly(key,e);
        if(required.includes(key))setFailure(message);
        else if(!reported.has(key)){reported.add(key);notify('Módulo no disponible: '+message,'error')}
      });
      unsub.push(()=>{sessionStopped=true;clearTimeout(syncTimer);stop()});
    }catch(e){
      console.error('PuntoFarma Firebase / '+key,e);
      if(required.includes(key))setFailure(friendly(key,e));
      else notify(friendly(key,e),'error');
    }
  };
  // CATÁLOGO: lectura única inicial o caché verificada por versión.
  // Cada modificación hecha desde Mi inventario actualiza SYNC_DOC, evitando
  // descargas reiteradas de los ~700 productos en cada conexión del celular.
  const loadCatalog=async(version,force)=>{
    const cache=role==='supervisor'?null:readCache('catalog');
    if(!force && cache && cache.version===version && Array.isArray(cache.products)){
      STORE.products=cache.products.map(publicProduct);
      received.add('catalog');updateReady();
      return;
    }
    const snapshot=await fsm.getDocs(fsm.collection(db,'catalog'));
    if(sessionStopped)return;
    const rows=snapshot.docs.filter(d=>d.id!==SYNC_DOC).map(d=>({id:d.id,...d.data()}));
    STORE.products=role==='supervisor'?rows:rows.map(publicProduct);
    if(role!=='supervisor')writeCache('catalog',{version,products:STORE.products,at:Date.now()});
    received.add('catalog');updateReady();
  };
  const refreshCatalog=async(version,force=false)=>{
    refreshingCatalog=refreshingCatalog.catch(()=>{}).then(async()=>{
      if(sessionStopped)return;
      await loadCatalog(version,force);
      if(role==='supervisor'){
        const snap=await fsm.getDocs(fsm.collection(db,'stock'));
        if(sessionStopped)return;
        const stock=new Map(snap.docs.map(d=>[d.id,d.data()]));
        STORE.products=STORE.products.map(p=>({...p,...(stock.get(p.id)||{})}));
        received.add('stock');updateReady();
      }
    }).catch(e=>{
      console.error('PuntoFarma Firebase / catálogo',e);
      if(!STORE.ready)setFailure(friendly('catalog',e));
      else if(!sessionStopped)notify('No se pudo actualizar el catálogo: '+String(e.message||e),'error');
    });
    return refreshingCatalog;
  };
  // Ediciones pequeñas: descargar solo los SKU modificados, no todo el catálogo.
  const refreshCatalogDelta=(version,signal)=>{
    const ids=Array.isArray(signal?.ids)?signal.ids:[];
    if(!received.has('catalog')||!ids.length||ids.length>12||!['upsert','delete'].includes(signal?.action)){
      return refreshCatalog(version,true);
    }
    refreshingCatalog=refreshingCatalog.catch(()=>{}).then(async()=>{
      if(sessionStopped)return;
      const byId=new Map(STORE.products.map(p=>[p.id,p]));
      for(const id of ids){
        if(signal.action==='delete'){byId.delete(id);continue}
        const docSnap=await fsm.getDoc(fsm.doc(db,'catalog',id));
        if(sessionStopped)return;
        if(!docSnap.exists()){byId.delete(id);continue}
        const product={id,...docSnap.data()};
        if(role==='supervisor'){
          const stockSnap=await fsm.getDoc(fsm.doc(db,'stock',id));
          byId.set(id,{...product,...(stockSnap.exists()?stockSnap.data():{})});
        }else byId.set(id,publicProduct(product));
      }
      if(sessionStopped)return;
      STORE.products=[...byId.values()];
      if(role!=='supervisor')writeCache('catalog',{version,products:STORE.products,at:Date.now()});
      scheduleRender();
    }).catch(e=>{
      console.error('PuntoFarma Firebase / cambio catálogo',e);
      if(!sessionStopped)notify('No se pudo descargar un cambio de catálogo: '+String(e.message||e),'error');
      // Siguiente apertura hará comparación de versiones y carga completa.
    });
    return refreshingCatalog;
  };
  // Se mantiene una sola escucha de 1 documento, no de todos los productos.
  try{
    const stop=fsm.onSnapshot(fsm.doc(db,'catalog',SYNC_DOC),snap=>{
      if(sessionStopped)return;
      const data=snap.exists()?snap.data():{};
      const version=snap.exists()?String(data.version||'legacy'):'legacy';
      if(!catalogVersionSeen){catalogVersionSeen=true;lastCatalogVersion=version;refreshCatalog(version)}
      else if(version!==lastCatalogVersion){lastCatalogVersion=version;refreshCatalogDelta(version,data)}
    },e=>{if(!sessionStopped)setFailure(friendly('catalog',e))});
    unsub.push(()=>{sessionStopped=true;clearTimeout(syncTimer);stop()});
  }catch(e){setFailure(friendly('catalog',e))}

  try{const cycleStop=fsm.onSnapshot(fsm.doc(db,'inventory_cycle_status','current'),snap=>{const c=snap.exists()?snap.data():null;PF_SESSION=c?.status==='active'?c:null;scheduleRender();},e=>console.warn('Jornadas:',e));unsub.push(cycleStop)}catch(e){console.warn(e)}
  // CONTEO EN VIVO: se mantiene la escucha completa únicamente de los conteos
  // del propio usuario, o de todos para Supervisión (ERI y diferencias exactos).
  if(role==='supervisor'||role==='operator'){
    watch('counts',role==='supervisor'?fsm.collection(db,'counts'):
      fsm.query(fsm.collection(db,'counts'),fsm.where('uid','==',uid)),a=>{
       STORE.counts=a;
       if(role==='supervisor')STORE.markers=a.map(c=>({id:c.id,skuId:c.skuId,uid:c.uid,createdAt:c.createdAt}));
    });
  }
  // AVANCE MÓVIL: conservar el conjunto completo en caché (24h), consultar
  // solamente marcadores creados después del último recibido y leer todo
  // únicamente al no tener caché o al pulsar «Actualizar».
  // Nunca se altera counts, ni se publica el teórico a los colaboradores.
  if(role==='operator'){
    let markerMap=new Map(),markerCache=readCache('markers');
    let fullAt=Number(markerCache?.fullAt||0);
    let lastMarkerDate='';
    const persistMarkers=debounce(()=>writeCache('markers',{
      fullAt,watermark:lastMarkerDate,rows:[...markerMap.values()]
    }),2200);
    const setMarkers=(rows)=>{
      markerMap=new Map(rows.map(m=>[m.id,m]));
      lastMarkerDate=[...markerMap.values()].reduce((max,m)=>
        String(m.createdAt||'')>max?String(m.createdAt||''):max,'');
      STORE.markers=[...markerMap.values()];STORE.progressReady=true;
      persistMarkers();scheduleRender();
    };
    const startIncremental=()=>{
      if(sessionStopped)return;
      // No usar limit(80): volvía a leer 80 documentos por reconexión.
      // Una consulta por fecha devuelve solo los registros aún no cacheados.
      const q=fsm.query(fsm.collection(db,'markers'),fsm.where('createdAt','>',lastMarkerDate));
      watch('markers_delta',q,rows=>{
        let changed=false;
        for(const m of rows){if(!markerMap.has(m.id)){markerMap.set(m.id,m);changed=true}}
        if(changed){
          lastMarkerDate=[...markerMap.values()].reduce((max,m)=>
            String(m.createdAt||'')>max?String(m.createdAt||''):max,lastMarkerDate);
          STORE.markers=[...markerMap.values()];STORE.progressReady=true;
          persistMarkers();scheduleRender();
        }
      });
    };
    refreshMarkerProgress=async()=>{
      const snap=await fsm.getDocs(fsm.collection(db,'markers'));
      if(sessionStopped)return;
      fullAt=Date.now();
      setMarkers(snap.docs.map(d=>({id:d.id,...d.data()})));
      writeCache('markers',{fullAt,watermark:lastMarkerDate,rows:STORE.markers});
    };
    if(markerCache&&Array.isArray(markerCache.rows)&&Date.now()-fullAt<CACHE_MAX_AGE_MS){
      markerMap=new Map(markerCache.rows.map(m=>[m.id,m]));
      lastMarkerDate=String(markerCache.watermark||'')||[...markerMap.values()].reduce((max,m)=>
        String(m.createdAt||'')>max?String(m.createdAt||''):max,'');
      STORE.markers=[...markerMap.values()];STORE.progressReady=true;
      startIncremental();
    }else{
      refreshMarkerProgress().then(startIncremental).catch(e=>{
        if(sessionStopped)return;
        console.warn('PuntoFarma / avance global',e);
        STORE.progressReady=false;
        notify('El avance general no pudo actualizarse. Puedes seguir contando y reintentar con Actualizar.','error');
      });
    }
  }
  // SUPERVISIÓN: las colecciones auxiliares solo se escuchan al entrar a
  // la sección que las necesita. El conteo físico sigue EN VIVO siempre.
  if(role==='supervisor'){
    const liveStops=new Map();
    const configs={
      surplus:()=>[fsm.collection(db,'surplus'),a=>STORE.surplus=a],
      recounts:()=>[fsm.collection(db,'recounts'),a=>STORE.recounts=a],
      recount_entries:()=>[fsm.collection(db,'recount_entries'),a=>STORE.recountEntries=a],
      profiles:()=>[fsm.collection(db,'profiles'),a=>STORE.profiles=a]
    };
    const routes={dashboard:['surplus','recounts','recount_entries'],
      inventory:['surplus'],locations:[],expiry:['surplus'],users:['profiles']};
    refreshSupervisorFeeds=(route)=>{
      if(sessionStopped)return;
      const needed=new Set(routes[route]||routes.dashboard);
      for(const [key,stop] of liveStops){
        if(!needed.has(key)){stop();liveStops.delete(key)}
      }
      for(const key of needed){
        if(liveStops.has(key))continue;
        const [reference,apply]=configs[key]();
        try{
          const stop=fsm.onSnapshot(reference,snap=>{
            if(sessionStopped||!liveStops.has(key))return;
            apply(snap.docs.map(d=>({id:d.id,...d.data()})));
            received.add(key);updateReady();
          },e=>{
            if(sessionStopped)return;
            console.error('PuntoFarma Firebase / '+key,e);
            const message=friendly(key,e);
            if(required.includes(key)&&!STORE.ready)setFailure(message);
            else if(!reported.has(key)){reported.add(key);notify('Módulo no disponible: '+message,'error')}
          });
          liveStops.set(key,stop);
        }catch(e){
          console.error('PuntoFarma Firebase / '+key,e);
          if(required.includes(key)&&!STORE.ready)setFailure(friendly(key,e));
          else notify(friendly(key,e),'error');
        }
      }
    };
    unsub.push(()=>{
      for(const stop of liveStops.values())stop();
      liveStops.clear();refreshSupervisorFeeds=null;
    });
    refreshSupervisorFeeds(STATE.panel);
  }else if(role==='operator'){
    watch('surplus',fsm.query(fsm.collection(db,'surplus'),fsm.where('uid','==',uid)),a=>STORE.surplus=a);
  }else if(role==='recount'){
    watch('recounts',fsm.collection(db,'recounts'),a=>STORE.recounts=a);
    watch('recount_entries',fsm.query(fsm.collection(db,'recount_entries'),fsm.where('uid','==',uid)),a=>STORE.recountEntries=a);
  }else if(role==='locations'){
    // Solo 1 lectura inicial (o caché de 6h); sin escuchas en vivo de ubicaciones, conteos ni stock.
    firebaseAdapter.loadLocations().catch(e=>{console.error('PuntoFarma / ubicaciones',e);STORE.locationsLoaded=false;notify('No se pudieron cargar ubicaciones. Pulsa Actualizar: '+String(e.message||e),'error');});
  }
 },
 async signOut(){unsub.forEach(f=>f());unsub=[];refreshMarkerProgress=null;refreshSupervisorFeeds=null;await fb.authm.signOut(fb.auth)}

function loginEmail(u){
  if(!/^[a-z0-9._-]{3,32}$/i.test(u.trim()))throw Error('Usuario: utiliza de 3 a 32 caracteres válidos.');
  return 'pfinv.'+u.trim().toLowerCase()+'@acceso.puntofarma.invalid';
}
function firebasePassword(pin){
  if(String(pin).length<4)throw Error('La clave debe contener al menos 4 caracteres.');
  return 'PFi#'+String(pin);
}
function canBootstrap(username,pin){return username.trim().toLowerCase()==='kevin' && pin==='1234'}

function scheduleRender(){clearTimeout(toastTimer);toastTimer=setTimeout(()=>{if(STATE.screen!=='app')return;
 if(STORE.role==='supervisor'&&STORE.ready&&STATE.panel==='locations'&&document.getElementById('super-loc-table')){
   updateSupervisorLocationsView();return;
 }
 if(STORE.role==='locations'&&STORE.ready&&STATE.locationView==='consult'&&document.getElementById('loc-consult-input')){
   const box=document.getElementById('loc-consult-results');if(box)box.innerHTML=locationConsultResults();
   const metric=document.getElementById('loc-metrics');if(metric)metric.innerHTML=locationStatsMarkup();return;
 }
 if(STORE.role==='locations'&&STORE.ready&&document.getElementById('loc-search')){
   const tmp=document.createElement('div');tmp.innerHTML=locationsWorkerMarkup();
   for(const id of ['loc-metrics','loc-recent-list']){const old=document.getElementById(id),fresh=tmp.querySelector('#'+id);if(old&&fresh)old.replaceWith(fresh)}
   // No reemplazar los campos mientras escriben en el celular.
   return;
 }
 if(STORE.role==='operator'&&STORE.ready&&document.querySelector('#count-form,#surplus-form')){
   // No reemplazar el formulario: evita saltos, scroll y reapertura del teclado al llegar snapshots.
   const tmp=document.createElement('div');tmp.innerHTML=workerMarkup();
   for(const selector of ['.worker-welcome','.worker-cols > section:nth-child(2)', '.worker-header .pill']){
     const old=document.querySelector(selector),fresh=tmp.querySelector(selector);
     if(old&&fresh)old.replaceWith(fresh);
   }
   return;
  }
  if(STORE.role==='recount'&&STORE.ready&&STATE.screen==='app'&&document.querySelector('#recount-queue')){
    // Actualizar la cola solo cuando ya existe en pantalla. Si sigue el cargador, render() dibuja la vista inicial.
    const assigned=STORE.recounts.some(t=>t.status==='in_progress'&&t.assignedUid===STORE.uid);
    if(document.querySelector('#recount-form')&&!assigned){render();return}
    const fresh=document.createElement('div');fresh.innerHTML=recountMarkup();
    const oldQueue=document.querySelector('#recount-queue'),newQueue=fresh.querySelector('#recount-queue');
    if(oldQueue&&newQueue)oldQueue.replaceWith(newQueue);
    const oldMetrics=document.querySelector('#recount-metrics'),newMetrics=fresh.querySelector('#recount-metrics');
    if(oldMetrics&&newMetrics)oldMetrics.replaceWith(newMetrics);
    const oldSaved=document.querySelector('.recount-saved'),newSaved=fresh.querySelector('.recount-saved');
    if(oldSaved&&newSaved)oldSaved.replaceWith(newSaved);
    const oldBtns=document.querySelector('.recount-buttons'),newBtns=fresh.querySelector('.recount-buttons');
    if(oldBtns&&newBtns)oldBtns.replaceWith(newBtns);
    if(!document.querySelector('#recount-form')&&assigned)render();
    return;
  }

function suggestedFactor(p){
 if(!p)return 1;
 const configured=Number(p.unitsPerPresentation)||1;
 if(configured>1)return configured;
 const name=String(p.name||'').toUpperCase();
 const match=name.match(/(?:\bX|×)\s*(\d{1,3})(?=\b|\/|\-)/);
 if(!match)return 1;
 const n=Number(match[1]);if(!Number.isSafeInteger(n)||n<2||n>200)return 1;
 const after=name.slice(match.index+match[0].length);
 const before=name.slice(0,match.index);
 // Evita confundir tamaños en ML, GR, MG, etc. con comprimidos por caja.
 if(/^\s*(?:ML|MG|GR|G|L|CM|KG)\b/.test(after))return 1;
 const dosage=/\b(?:TAB|TABLETA|TABLETAS|COMP|COMPRIMIDO|COMPRIMIDOS|CAPS|CAPSULA|CAPSULAS|SOBRE|SOBRES|PASTILLA|PASTILLAS|GRAGEA|GRAGEAS|PERLA|PERLAS)\b/i;
 const category=String(p.category||'').toUpperCase();
 const explicit=dosage.test(before)||dosage.test(after);
 const meds=/(MEDICINA|GEN[EÉ]RICO|FARMAC)/.test(category);
 const trailingSlash=/^\s*\//.test(after);
 return (explicit||(trailingSlash&&meds))?n:1;
}
function needsUnitReview(p,physical){
 const t=Number(p.theoretical)||0,f=Number(physical)||0,fac=suggestedFactor(p);
 return p.unitReviewResolved!==true&&t>0&&f>t&&fac>1&&t<fac;
}

function completedRecountResults(){
 // Solo un reconteo FINALIZADO y con registros del intento vigente puede
 // reemplazar la cantidad del primer conteo. Los intentos antiguos se ignoran.
 const finished=new Map();
 for(const task of STORE.recounts){
   // Durante otro reconteo, conservar el último resultado aprobado.
   const effectiveId=task.status==='completed'?task.attemptId:task.previousAttemptId;
   if(!effectiveId)continue;
   finished.set(task.skuId,{attemptId:effectiveId,qty:0,entries:0,people:new Set()});
 }
 for(const e of STORE.recountEntries){
   const result=finished.get(e.skuId);
   if(result&&result.attemptId===e.attemptId){
     result.qty+=Number(e.qty)||0;
     result.entries++;
     if(e.name)result.people.add(e.name);
   }
 }
 // Nunca interpretar una respuesta de Firebase pendiente como cero unidades.
 for(const [id,result] of finished){if(!result.entries)finished.delete(id)}
 return finished;
}
function compute(){
 const by=new Map(),completed=new Map();
 for(const c of STORE.counts.filter(pfCountIsActive)){
   const x=by.get(c.skuId)||{qty:0,entries:0,people:new Set()};
   x.qty+=Number(c.qty)||0;x.entries++;x.people.add(c.name);by.set(c.skuId,x);
 }
 for(const c of STORE.surplus.filter(pfCountIsActive)){
   if(!c.linkedSkuId||!STORE.products.some(p=>p.id===c.linkedSkuId))continue;
   const x=by.get(c.linkedSkuId)||{qty:0,entries:0,people:new Set()};
   x.qty+=Number(c.qty)||0;x.entries++;x.people.add(c.name);by.set(c.linkedSkuId,x);
 }
 const summary={total:STORE.products.filter(p=>pfSessionIncludes(p.id)).length,touched:0,exact:0,missing:0,extra:0,review:0,unseen:0,totalTheory:0,totalPhysical:0,absDiff:0,unitMissing:0,unitExtra:0};
 const statuses=STORE.products.filter(p=>pfSessionIncludes(p.id)).map(p=>{
   const first=by.get(p.id),second=completed.get(p.id),t=Number(p.theoretical)||0;
   const initialPhysical=first?.qty||0;
   // El reconteo reemplaza el físico solo al finalizarse; nunca se SUMAN ambos.
   const f=second?second.qty:initialPhysical;
   const hasResult=!!first||!!second;
   summary.totalTheory+=t;summary.totalPhysical+=f;
   let st;
   if(!hasResult){st='pending';summary.unseen++;if(t>0){summary.missing++;summary.unitMissing+=t}}
   else{
     summary.touched++;
     if(f===t){st='ok';summary.exact++}
     else if(needsUnitReview(p,f)){st='review';summary.review++}

function locationMatches(query){
 const q=String(query||'').trim();if(!q)return [];
 const tokens=norm(q).split(/\s+/).filter(Boolean);
 return STORE.products.filter(p=>{
  const hay=norm(String(p.code||'')+' '+String(p.name||''));return tokens.every(t=>hay.includes(t));
 }).sort((a,b)=>{
  const sa=(norm(a.code).startsWith(norm(q))?0:norm(a.name).startsWith(norm(q))?1:2);
  const sb=(norm(b.code).startsWith(norm(q))?0:norm(b.name).startsWith(norm(q))?1:2);
  return sa-sb;
 }).slice(0,12);
}

function workerLocationLevels(code){
 const m=String(code||'').toUpperCase().trim().match(/^([TVP])(\d{1,2})$/);
 if(!m)return [];
 const kind=m[1],number=Number(m[2]);
 if(number<1||number>(kind==='T'?11:kind==='V'?5:3))return [];
 // T2, T5 y T7 admiten niveles manuales; no restringir niveles existentes del usuario.
 const max=kind==='V'?4:kind==='P'?6:5;
 return Array.from({length:max},(_,i)=>kind+number+'-N'+(i+1));
}

async function pfCycleStart(data){
 await pfLoadCycles();if(PF_SESSION)throw Error('Ya existe una jornada activa.');
 const scope=data.scope==='selected'?'selected':'all';const codes=String(data.codes||'').split(/[\s,;]+/).map(x=>x.trim()).filter(Boolean);

 if(scope==='selected'&&(!skus.length||skus.length!==new Set(codes).size))throw Error('Algunos códigos no existen en el inventario. Revisa el listado.');
 if(!skus.length)throw Error('No existen productos para contar.');
 const record={id:'cy_'+Date.now()+'_'+strId().slice(0,6),status:'active',scope,skuIds:scope==='all'?[]:skus.map(p=>p.id),startedAt:new Date().toISOString(),createdBy:STORE.uid,totalSkus:skus.length,baseline:skus.map(p=>({id:p.id,code:p.code,name:p.name,qty:Number(p.theoretical)||0})),counts:0};
 if(!confirm(`Iniciar una jornada con ${skus.length} referencias? Los conteos anteriores quedarán separados por fecha.`))return;
 await pfWriteCycle(record);closeModal();render();notify('Jornada creada.');
}

 const baseline=new Map((session.baseline||[]).map(p=>[p.id,p]));
 const adjustment=[...physical.entries()].map(([id,qty])=>({code:baseline.get(id)?.code||'',name:baseline.get(id)?.name||'',previous:baseline.get(id)?.qty??0,physical:qty,difference:qty-(baseline.get(id)?.qty??0)}));

 await exportXlsx([...adjustment.map(x=>({codigo:x.code,producto:x.name,teoricoInicial:x.previous,conteoFisico:x.physical,diferencia:x.difference,decision:'No ajustar stock operativo'})),...notCounted.map(p=>({codigo:p.code,producto:p.name,teoricoInicial:p.qty,conteoFisico:'SIN CONTAR',diferencia:'',decision:'No ajustar stock operativo'}))],`puntofarma_cierre_${session.id}.xlsx`);

 const record={...session,status:'closed',closedAt:new Date().toISOString(),closedBy:STORE.uid,counts:cs.length,adjustments:adjustment,unseen:notCounted.length,policy:'franchise_stock_baseline_no_physical_stock_override'};

async function pfEntryPreview(file){
 const rows=await invoiceRawRows(file);if(!rows.length)throw Error('Documento vacío.');
 const byCode=new Map(STORE.products.map(p=>[p.code,p]));const qty=new Map();let invalid=0;
 for(const row of rows){const keys=Object.keys(row),pick=(terms)=>row[keys.find(k=>terms.some(t=>norm(k).includes(t)))]??'';
 const code=String(pick(['codigo','barra','sku'])).trim().replace(/\.0$/,'');const units=Number(String(pick(['cantidad','unidades','qty'])).replace(',','.'));
 if(!code&&!units)continue;if(!byCode.has(code)||!Number.isSafeInteger(units)||units<=0){invalid++;continue}qty.set(code,(qty.get(code)||0)+units)}
 if(invalid||!qty.size)throw Error(`${invalid} filas tienen códigos inexistentes o cantidades no válidas. Corrige todo antes de aplicar. No se agregaron productos.`);
 PF_ENTRY_PENDING={fileName:file.name,items:[...qty].map(([code,units])=>({code,units,id:byCode.get(code).id})),before:new Map(STORE.products.map(p=>[p.id,Number(p.theoretical)||0]))};
 const units=[...qty.values()].reduce((a,b)=>a+b,0);
 showModal('Vista previa · Entradas por factura',`<div class="note">${qty.size} códigos · ${nfmt(units)} unidades a sumar. No se alteran precios ni productos fuera del archivo.</div><button class="btn btn-outline" data-action="pf-entry-backup">Descargar respaldo</button><div class="dialog-footer"><button class="btn btn-outline" data-action="close-modal">Cancelar</button><button class="btn btn-primary" data-action="pf-entry-apply">Confirmar suma</button></div>`)
}
async function pfEntryApply(){

 const q=PF_ENTRY_PENDING;
 if(!confirm('¿Sumar las cantidades indicadas? Confirma que esta factura no se haya registrado antes.'))return;
 const original=new Map(STORE.products.map(p=>[p.id,p]));const updated=q.items.map(x=>({...original.get(x.id),theoretical:Number(original.get(x.id).theoretical||0)+x.units}));
 if(q.items.some(x=>Number(original.get(x.id).theoretical||0)!==q.before.get(x.id)))throw Error('Se modificó el stock desde la vista previa. Recarga el archivo.');
 await adapter.applyTheoryUpdate(updated);
 const movement={id:'mov_'+Date.now()+'_'+strId().slice(0,6),createdAt:new Date().toISOString(),fileName:q.fileName,skus:q.items.length,units:q.items.reduce((a,x)=>a+x.units,0),items:q.items};
 try{if(STORE.appMode==='demo'){PF_STOCK_MOVEMENTS.unshift(movement);saveDemo('pf_movements',PF_STOCK_MOVEMENTS)}else await fb.fsm.setDoc(fb.fsm.doc(fb.db,'stock_movements',movement.id),movement)}catch(e){notify('Se sumó el stock, pero falló el registro del movimiento: '+e.message,'error')}
 PF_ENTRY_PENDING=null;closeModal();await adapter.loadAll?.();await pfLoadCycles();render();notify('Entradas agregadas al stock.');
}

function dailyPrice(v){const text=String(v??'').trim().replace(/\s|\$/g,'');if(!text)return NaN;let canonical=text;if(text.includes(',')&&text.includes('.'))canonical=text.lastIndexOf(',')>text.lastIndexOf('.')?text.replace(/\./g,'').replace(',','.'):text.replace(/,/g,'');else canonical=text.replace(',','.');const n=Number(canonical);return Number.isFinite(n)&&n>=0?n:NaN}
async function dailyStockPreview(file){
 const raw=await invoiceRawRows(file);if(!raw.length)throw Error('Reporte vacío.');
 const normalized=new Map(),problems=[];
 for(let i=0;i<raw.length;i++){
  let obj={};for(const [k,v] of Object.entries(raw[i]))obj[norm(k).replace(/\s+/g,'')]=v;
  const get=(...names)=>{for(const k of names){let v=obj[norm(k).replace(/\s+/g,'')];if(v!==undefined&&v!==null)return v;}return''};
  const code=String(get('codigo','código','code','sku')).trim().replace(/\.0$/,''),name=String(get('nombre','producto','descripcion')).trim(),quantity=Number(String(get('cantidad','stock','qty')).replace(',','.')),price=dailyPrice(get('pvp','precio','precioventa'));
  if(!code&&!name)continue;
  if(!code||!name||!Number.isSafeInteger(quantity)||quantity<0||!Number.isFinite(price)){problems.push('Fila '+(i+2)+': código, nombre, cantidad o PVP inválido');continue;}
  if(normalized.has(code)){problems.push('Código repetido en el reporte: '+code);continue}
  normalized.set(code,{code,name,quantity,price});
 }
 if(problems.length)throw Error('No se aplicó ningún cambio. Corrige el Excel: '+problems.slice(0,8).join(' | ')+(problems.length>8?' ('+problems.length+' problemas)':''));
 if(!normalized.size)throw Error('No se encontraron productos válidos.');
 const existingByCode=new Map();for(const p of STORE.products){if(!existingByCode.has(p.code))existingByCode.set(p.code,[]);existingByCode.get(p.code).push(p)}
 const clashes=[...normalized.keys()].filter(code=>(existingByCode.get(code)||[]).length>1);if(clashes.length)throw Error('Códigos duplicados en el catálogo de Firebase. Resolver primero: '+clashes.slice(0,10).join(', '));
 const updates=[],added=[];for(const r of normalized.values()){
  const old=existingByCode.get(r.code)?.[0];if(old)updates.push({...old,theoretical:r.quantity,pvp:r.price,pvpUnit:r.price,pvpTotal:r.price});
  else added.push(cleanSku({id:await stableId(r.code,r.name),code:r.code,name:r.name,theoretical:r.quantity,pvp:r.price,pvpUnit:r.price,pvpTotal:r.price,category:'',presentation:'UNIDAD'}));
 }
 const absent=STORE.products.filter(p=>!normalized.has(p.code)).map(p=>({...p,theoretical:0}));
 const changes=updates.filter(p=>{const old=existingByCode.get(p.code)[0];return Number(old.theoretical)!==p.theoretical||Number(old.pvp)!==p.pvp});
 PF_DAILY_PENDING={products:[...updates,...added,...absent], sourceRows:normalized.size, fileName:file.name, before:STORE.products.map(p=>({code:p.code,qty:Number(p.theoretical)||0})),summary:{rows:normalized.size,changed:changes.length,newProducts:added.length,zeroed:absent.filter(p=>Number(existingByCode.get(p.code)?.[0]?.theoretical)>0).length,zeros:[...updates,...added,...absent].filter(p=>Number(p.theoretical)===0).length}};
 const q=PF_DAILY_PENDING.summary;

// Reportes de existencias: variaciones estimadas, no facturación ni ventas confirmadas.
async function pfFetchSalesReports(){
 PF_SALES_ERROR='';
 try {
  if(STORE.appMode==='demo') {PF_SALES_REPORTS=loadDemo('pf_sales_reports',[]);return;}
  if(STORE.role!=='supervisor')return;
  const snap=await fb.fsm.getDocs(fb.fsm.collection(fb.db,'stock_reports'));
  PF_SALES_REPORTS=snap.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>String(b.createdAt).localeCompare(String(a.createdAt)));
 }catch(e){PF_SALES_ERROR=String(e.message||e);}
}
async function pfSaveSalesReport(record){
 if(STORE.appMode==='demo') {PF_SALES_REPORTS.unshift(record);saveDemo('pf_sales_reports',PF_SALES_REPORTS);return;}
 await fb.fsm.setDoc(fb.fsm.doc(fb.db,'stock_reports',record.id),record);

function pfCalcSales(before,after){
 const old=new Map(before.map(p=>[String(p.code),Number(p.qty)||0]));
 return after.map(p=>{const prev=old.get(String(p.code));if(prev===undefined)return null;
 const current=Number(p.theoretical)||0,diff=prev-current;
 return diff>0?{code:p.code,name:p.name,before:prev,after:current,units:diff,pvp:Number(p.pvp)||0}:null;
 }).filter(Boolean);
}

async function dailyStockApply(){
 if(!PF_DAILY_PENDING)throw Error('Vuelve a seleccionar el reporte.');
 if(STORE.role!=='supervisor')throw Error('Acción exclusiva del supervisor.');
 if(!confirm('¿Confirmas que este es el reporte COMPLETO del día y deseas poner en cero los códigos ausentes?'))return;
 const pending=PF_DAILY_PENDING, buttons=[...document.querySelectorAll('[data-action="daily-stock-apply"]')];
 buttons.forEach(b=>b.disabled=true);
 try{
  await pfFetchSalesReports();
  if(PF_SALES_ERROR)throw Error('No se pudo consultar el histórico antes de actualizar: '+PF_SALES_ERROR);
  const isBaseline=PF_SALES_REPORTS.length===0;
  const decreases=isBaseline?[]:pfCalcSales(pending.before,pending.products);
  await adapter.applyTheoryUpdate(pending.products,(n,total)=>{const el=document.getElementById('pf-daily-progress');if(el)el.textContent=`Actualizando ${n} / ${total} referencias. No cierres la ventana.`});
  STORE.products=pending.products.map(cleanSku);PF_DAILY_PENDING=null;
  const oldCodes=new Set(pending.before.map(x=>x.code));
  const record={id:'r_'+Date.now()+'_'+strId().slice(0,8),createdAt:new Date().toISOString(),fileName:pending.fileName||'',baseline:isBaseline,totalRows:pending.sourceRows,estimatedUnits:decreases.reduce((a,x)=>a+x.units,0),decreasedSkus:decreases.length,newSkus:pending.products.filter(x=>!oldCodes.has(x.code)).length,decreases};
  try{await pfSaveSalesReport(record)}catch(e){notify('Stock actualizado, PERO el histórico no se pudo guardar: '+e.message,'error')}
  closeModal();notify('Stock y PVP actualizados; ubicaciones y conteos conservados.');await adapter.loadAll?.();render();
 }catch(e){notify('Actualización interrumpida: '+e.message+'. Revisa datos antes de repetirla.','error')}finally{buttons.forEach(b=>b.disabled=false)}
}

async function invoiceRawRows(file){
 if(file.name.toLowerCase().endsWith('.csv'))return csvParse(await file.text());
 if(!window.XLSX)await new Promise((ok,no)=>{const scr=document.createElement('script');scr.src='https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js';scr.onload=ok;scr.onerror=()=>no(Error('No se pudo abrir el lector de Excel. Comprueba internet.'));document.head.appendChild(scr)});
 const wb=window.XLSX.read(await file.arrayBuffer(),{type:'array'});
 const sheet=wb.Sheets[wb.SheetNames[0]];
 return window.XLSX.utils.sheet_to_json(sheet,{raw:false,defval:''});
}
function invoiceFields(row){
 const obj={};for(const [key,val] of Object.entries(row))obj[norm(key).replace(/\s+/g,'')]=val;
 const get=(...names)=>{for(const k of names){const v=obj[norm(k).replace(/\s+/g,'')];if(v!==undefined&&v!==null&&String(v).trim()!=='')return v}return''};
 return {code:String(get('codigo de barras','codigo barras','codigo','code','sku')).trim().replace(/\.0$/,''),
 name:String(get('item producto','item / producto','item','producto','nombre','descripcion')).trim(),
 qty:numv(get('cantidad','qty','cantidad facturada','unidades facturadas')),
 invoice:String(get('factura','numero factura','numero de factura')).trim(),
 lineTotal:numv(get('valor total','total','subtotal')),
 category:String(get('detalle categoria','categoria','category')).trim()};
}
function invoiceNameKey(s){return norm(s).replace(/\s+/g,' ').trim()}
function invoiceSuggestedFactor(name){
 const text=String(name||'');
 const exact=text.match(/\[\s*CAJA\s*[Xx]\s*(\d{1,4})\s*\]/i);
 if(exact&&+exact[1]>1&&+exact[1]<=1000)return {n:+exact[1],kind:'Caja explícita'};
 const m=text.match(/(?:^|[\s\[(])(?:CAJA\s*)?[Xx*]\s*(\d{1,4})(?!\d|\s*(?:ML|MG|GR|G|L|CM|MM)\b)/i);
 if(m&&+m[1]>1&&+m[1]<=1000)return {n:+m[1],kind:'Revisar xN'};
 return {n:1,kind:'Unidad'};
}
function invoiceChoices(candidate){
 const options=STORE.products.filter(p=>p.code===candidate.code);
 const candidates=INVOICE_REVIEW?.items.filter(x=>x.code===candidate.code)||[];
 const exact=options.filter(p=>invoiceNameKey(p.name)===invoiceNameKey(candidate.name));
 if(exact.length===1)return {targetId:exact[0].id,ambiguous:false};
 if(options.length===1&&candidates.length===1)return {targetId:options[0].id,ambiguous:false,renamed:invoiceNameKey(options[0].name)!==invoiceNameKey(candidate.name)};
 if(!options.length)return {targetId:'NEW',ambiguous:false};
 return {targetId:'',ambiguous:true};
}
async function invoiceOpenPreview(file){
 const raw=await invoiceRawRows(file);
 if(!raw.length)throw Error('El archivo no contiene filas de datos.');
 let errors=[],group=new Map(),totalRaw=0;
 for(let i=0;i<raw.length;i++){
   const r=invoiceFields(raw[i]);if(!r.code&&!r.name)continue;
   if(!r.code||!r.name||!Number.isSafeInteger(r.qty)||r.qty<=0){errors.push(`Fila ${i+2}: código, producto o cantidad inválidos`);continue;}
   const k=r.code+'|'+invoiceNameKey(r.name);totalRaw++;
   if(!group.has(k))group.set(k,{key:k,code:r.code,name:r.name,packs:0,costTotal:0,invoiceNos:new Set(),category:r.category,sourceLines:0});
   const g=group.get(k);g.packs+=r.qty;g.costTotal+=r.lineTotal;g.sourceLines++;if(r.invoice)g.invoiceNos.add(r.invoice);
 }
 if(errors.length)throw Error(`${errors.length} filas necesitan corrección (${errors.slice(0,3).join(' · ')}). No se aplicó ningún cambio.`);
 if(!group.size)throw Error('El archivo no contiene las columnas Código de barras, Ítem / Producto y Cantidad.');
 INVOICE_REVIEW={fileName:file.name,items:[...group.values()],current:0,filter:'all',confirmed:false,backedUp:false,sourceRows:totalRaw,openedAt:now(),snapshot:STORE.products.map(p=>({id:p.id,theoretical:p.theoretical})),applied:false,links:[],linkPage:0};
 for(const a of INVOICE_REVIEW.items){
   const suggest=invoiceSuggestedFactor(a.name);a.suggested=suggest.n;a.hint=suggest.kind;
   a.factor=1;a.factorConfirmed=suggest.n===1;a.quantityOverride=null;
   const matched=invoiceChoices(a);Object.assign(a,matched);
   a.newId=await stableId(a.code,a.name);
 }
 invoiceRenderReview();
}

     name:existing?.name||a.name,category:existing?.category||a.category||'',

function invoiceIssues(){if(!INVOICE_REVIEW)return [];

 const duplicateIds=new Set();const assigned=new Set();for(const p of a){let id=p.targetId==='NEW'?p.newId:p.targetId;if(assigned.has(id))duplicateIds.add(id);assigned.add(id)}

function invoiceRenderReview(){

function pfExcelCell(value,key){
 if(value==null)return {t:'s',v:''};

 if(/codigo|(^code$)|(^id$)|skuid|skuactual|posicion|codigo.*barra|factura/.test(k))return {t:'s',v:String(value)};
 // Fechas y horas como fechas reales de Excel, en hora local del dispositivo.
 if(/^(registro|modificado|fecharegistro|createdat|updatedat)$/.test(k)&&typeof value==='string'&&/^\d{4}-\d{2}-\d{2}T/.test(value)){
   const d=new Date(value);
   if(!Number.isNaN(d.getTime())){
     const ms=Date.UTC(d.getFullYear(),d.getMonth(),d.getDate(),d.getHours(),d.getMinutes(),d.getSeconds());
     return {t:'n',v:ms/86400000+25569,z:'dd/mm/yyyy hh:mm'};
   }

   const cleaned=value.trim().replace(',', '.');
   if(/^[-+]?\d+(?:\.\d+)?$/.test(cleaned))return {t:'n',v:Number(cleaned),z:/costo|precio/.test(k)?'#,##0.00':'#,##0.##'};

 dialog.innerHTML=`<section style="max-width:850px;margin:5vh auto;background:white;padding:22px;border-radius:16px;color:#16364b"><header style="display:flex;justify-content:space-between;gap:14px"><h2>Administrar PVP · Supervisión</h2><button id="pfpvpClose" style="padding:8px 13px">Cerrar</button></header><input id="pfpvpSearch" placeholder="Buscar código o producto" style="width:100%;padding:12px;border:1px solid #bdd5df;border-radius:10px"><div id="pfpvpRows" style="max-height:55vh;overflow:auto;margin-top:12px"></div><p id="pfpvpMsg" style="font-size:12px;color:#087fac;margin-top:10px"></p></section>`;
 document.body.append(dialog);$id('pfpvpClose').onclick=()=>dialog.style.display='none';$id('pfpvpSearch').oninput=render;
}
function ready(){return typeof STORE!=='undefined'&&STORE.role==='supervisor'&&STORE.ready&&typeof fb!=='undefined'&&!!fb}
function show(){if(!ready())return;$id('pfpvpDialog').style.display='block';$id('pfpvpSearch').value='';render()}
function render(){if(!ready())return;const q=($id('pfpvpSearch').value||'').toLocaleUpperCase().trim();const products=STORE.products.filter(p=>!q||String(p.code||'').toUpperCase().includes(q)||String(p.name||'').toUpperCase().includes(q)).slice(0,80);
 $id('pfpvpRows').innerHTML=products.map(p=>`<div style="display:flex;align-items:center;gap:10px;border-bottom:1px solid #e3edf2;padding:10px 2px;flex-wrap:wrap"><div style="flex:1;min-width:220px"><b>${escapeHtml(String(p.name||''))}</b><small style="display:block;color:#79909b">${escapeHtml(String(p.code||''))} · ${escapeHtml(p.id)}</small></div><label>PVP $ <input data-pfprice="${escapeHtml(p.id)}" type="number" step="0.01" min="0" placeholder="Pendiente" value="${p.pvp!=null&&Number(p.pvp)>0?Number(p.pvp).toFixed(2):''}" style="width:100px;padding:8px;border:1px solid #c8dce4;border-radius:7px"></label><button data-pfsave="${escapeHtml(p.id)}" style="padding:10px;border:0;background:#0786b5;color:white;border-radius:8px">Guardar</button></div>`).join('')||'<p>No hay coincidencias.</p>';
 $id('pfpvpRows').querySelectorAll('[data-pfsave]').forEach(b=>b.onclick=()=>savePvp(b.dataset.pfsave));}
function escapeHtml(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
async function savePvp(id){if(!ready())return;const input=[...$id('pfpvpRows').querySelectorAll('input[data-pfprice]')].find(x=>x.dataset.pfprice===id);const raw=input.value.trim();const amount=raw===''?null:Number(raw);if(amount!==null&&(!Number.isFinite(amount)||amount<0||amount>999999)){$id('pfpvpMsg').textContent='PVP inválido.';return}
 const p=STORE.products.find(p=>p.id===id);if(!p)return;const original=$id('pfpvpMsg');original.textContent='Guardando...';
 try{const batch=fb.fsm.writeBatch(fb.db);batch.update(fb.fsm.doc(fb.db,'stock',id),{pvp:amount,pvpUpdatedAt:new Date().toISOString()});batch.set(fb.fsm.doc(fb.db,'service_products',id),serviceProjection({...p,pvp:amount}));await batch.commit();p.pvp=amount;original.textContent='PVP guardado y sincronizado con Atención al Cliente.';render()}
 catch(e){original.textContent='No se pudo guardar: '+(e.message||e)} }
// Importación exclusivamente de PVP: ninguna operación modifica el inventario físico, stock ni ubicaciones.
const pfNormalize=v=>String(v??'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toUpperCase().replace(/[^A-Z0-9]+/g,' ').trim();
let pfPriceRows=[],pfReviewRows=[],pfOriginalRows=[];
function ensurePvpImport(){
 if($id('pfImportPvpDialog'))return;
 const el=document.createElement('div');el.id='pfImportPvpDialog';el.style.cssText='display:none;position:fixed;inset:0;z-index:115;background:#172c3f99;overflow:auto;padding:18px';
 el.innerHTML=`<section style="background:#fff;border-radius:17px;padding:22px;max-width:1100px;margin:3vh auto;color:#15334a"><header style="display:flex;justify-content:space-between;gap:12px"><h2>Importar únicamente PVP</h2><button id="pfImportClose" class="btn btn-outline">Cerrar</button></header><input id="pfImportFile" type="file" accept=".xlsx,.xls" class="input" style="padding:12px;height:auto"><div id="pfImportSummary" style="margin:15px 0;color:#446578" role="status">Selecciona el Excel para revisar los precios.</div><div id="pfImportTabs" style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px"><button class="btn btn-outline" type="button" data-pf-tab="changes">Listos para actualizar</button><button class="btn btn-outline" type="button" data-pf-tab="review">Revisar coincidencias</button><button class="btn btn-outline" type="button" data-pf-tab="missing">Sin coincidencia</button></div><div id="pfImportPreview" class="table-scroll" style="max-height:49vh;overflow:auto"></div><div id="pfImportProgress" role="status" style="color:#486878;font-size:12px;margin-top:8px"></div><div class="dialog-footer"><button class="btn btn-outline" id="pfImportCancel">Cancelar</button><button class="btn btn-primary" id="pfImportApply" disabled>Confirmar PVP revisados</button></div></section>`;
 document.body.appendChild(el);
 $id('pfImportClose').onclick=$id('pfImportCancel').onclick=()=>el.style.display='none';
 $id('pfImportFile').onchange=previewPvp;
 el.querySelectorAll('[data-pf-tab]').forEach(x=>x.onclick=()=>{pfActiveTab=x.dataset.pfTab;renderPvpPreview()});
 $id('pfImportPreview').addEventListener('change',e=>{const ctl=e.target.closest('select[data-pf-choice]');if(!ctl)return;const item=pfReviewRows[Number(ctl.dataset.pfChoice)];if(!item)return;item.choice=ctl.value;refreshPvpSelection();renderPvpPreview()});
 $id('pfImportApply').onclick=applyPvp;
}
let pfActiveTab='changes';
function openPvpImport(){if(!ready())return;ensurePvpImport();pfPriceRows=[];pfReviewRows=[];pfOriginalRows=[];pfActiveTab='changes';$id('pfImportFile').value='';$id('pfImportPreview').innerHTML='';$id('pfImportSummary').textContent='Selecciona el Excel para revisar los precios.';$id('pfImportProgress').textContent='';$id('pfImportApply').disabled=true;$id('pfImportPvpDialog').style.display='block'}
function pfMoney(n){return n==null?'Pendiente':'$'+Number(n).toFixed(2)}
function pfSafe(v){return escapeHtml(String(v??''))}
function pfKey(v){return pfNormalize(v)}
function pfParsePrice(raw){if(raw==null||String(raw).trim()==='')return null;let c=String(raw).trim().replace(/[$\s]/g,'');if(c.includes(',')&&c.includes('.'))c=c.lastIndexOf(',')>c.lastIndexOf('.')?c.replace(/\./g,'').replace(',','.'):c.replace(/,/g,'');else if(c.includes(','))c=c.replace(',','.');const n=Number(c);return Number.isFinite(n)&&n>0&&n<=999999?Math.round(n*100)/100:NaN}
function pfCandidateState(item){const id=item.status==='exact'?item.candidates[0]?.id:item.choice;return id?STORE.products.find(p=>p.id===id):null}
function refreshPvpSelection(){
 const targets=new Map(),block=new Set();
 for(const r of pfReviewRows){const p=pfCandidateState(r);if(!p||r.status==='invalid'||r.status==='no-price')continue;const prev=targets.get(p.id);if(prev&&prev.price!==r.price){block.add(p.id)}else if(!prev)targets.set(p.id,{product:p,price:r.price,row:r});}
 pfPriceRows=[...targets.values()].filter(x=>!block.has(x.product.id)&&(!Number.isFinite(Number(x.product.pvp))||x.product.pvp==null||Math.round(Number(x.product.pvp)*100)!==Math.round(x.price*100)));
 pfReviewRows.forEach(r=>{r.conflict=false;const p=pfCandidateState(r);if(p&&block.has(p.id))r.conflict=true});
 const exact=pfReviewRows.filter(r=>r.status==='exact').length,review=pfReviewRows.filter(r=>r.status==='suggestion'||r.status==='multi').length,approved=pfReviewRows.filter(r=>r.choice).length,missing=pfReviewRows.filter(r=>r.status==='missing').length,empty=pfReviewRows.filter(r=>r.status==='no-price').length,invalid=pfReviewRows.filter(r=>r.status==='invalid').length,conflicts=pfReviewRows.filter(r=>r.conflict).length;
 $id('pfImportSummary').textContent=`Filas: ${pfOriginalRows.length} · Por código único o código + nombre: ${exact} · Por revisar: ${review} (${approved} aprobadas) · PVP a actualizar: ${pfPriceRows.length} · Sin correspondencia de código: ${missing} · Sin precio: ${empty} · Inválidas: ${invalid} · Conflictos: ${conflicts}. Los códigos compartidos sin nombre coincidente requieren aprobación manual.`;
 $id('pfImportApply').disabled=!pfPriceRows.length;
}
async function previewPvp(){
 const msg=$id('pfImportSummary');$id('pfImportApply').disabled=true;pfPriceRows=[];pfReviewRows=[];
 try{
  const file=$id('pfImportFile').files[0];if(!file)return;
  const XLSX=await pfEnsureXlsx();
  const wb=XLSX.read(await file.arrayBuffer(),{type:'array'});pfOriginalRows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{defval:'',raw:false});
  if(!pfOriginalRows.length)throw Error('El Excel está vacío.');
  const byCode=new Map();for(const p of STORE.products){const c=pfKey(p.code);if(!c)continue;if(!byCode.has(c))byCode.set(c,[]);byCode.get(c).push(p)}
  pfReviewRows=pfOriginalRows.map((row,index)=>{
   const kv=Object.fromEntries(Object.entries(row).map(([k,v])=>[pfKey(k),v]));
   const code=String(kv['CODIGO DE BARRAS']??kv['CODIGO']??'').trim().replace(/\.0$/,'');
   const name=String(kv['ITEM PRODUCTO']??kv['PRODUCTO']??kv['NOMBRE']??'').trim();
   const raw=kv['PRECIO UNITARIO']??kv['PVP']??'';const price=pfParsePrice(raw);
   const r={index,code,name,price,candidates:[],status:'',choice:'',conflict:false};
   if(!code||!name||Number.isNaN(price)){r.status='invalid';return r}
   if(price==null){r.status='no-price';return r}
   const list=byCode.get(pfKey(code))||[];
   if(!list.length){r.status='missing';return r}
   const exact=list.filter(p=>pfKey(p.name)===pfKey(name));
   // Un código que corresponde a un solo SKU identifica el producto aun si el nombre difiere.
   // Para códigos compartidos, exigir además coincidencia única de nombre o revisión manual.
   if(list.length===1){r.candidates=list;r.status='exact'}
   else if(exact.length===1){r.candidates=exact;r.status='exact'}
   else{r.candidates=list;r.status='multi'}
   return r;
  });
  pfActiveTab='changes';refreshPvpSelection();renderPvpPreview();
 }catch(e){msg.textContent='No se pudo revisar el archivo: '+(e.message||e)}
}
function renderPvpPreview(){
 const holder=$id('pfImportPreview');if(!holder)return;
 $id('pfImportTabs').querySelectorAll('[data-pf-tab]').forEach(b=>{b.style.background=b.dataset.pfTab===pfActiveTab?'#dcf5ff':''});
 if(pfActiveTab==='changes'){
 const data=pfPriceRows.slice(0,120);holder.innerHTML=`<table class="data-table"><thead><tr><th>Código</th><th>Producto en inventario</th><th>PVP actual</th><th>PVP nuevo</th></tr></thead><tbody>${data.map(x=>`<tr><td>${pfSafe(x.product.code)}</td><td>${pfSafe(x.product.name)}</td><td>${pfMoney(x.product.pvp)}</td><td><b>${pfMoney(x.price)}</b></td></tr>`).join('')}</tbody></table>${pfPriceRows.length>120?'<p>Mostrando los primeros 120 cambios.</p>':''}${!data.length?'<p style="padding:12px">No hay precios listos para actualizar.</p>':''}`;
 }else if(pfActiveTab==='review'){
 const rows=pfReviewRows.filter(r=>r.status==='suggestion'||r.status==='multi'||r.conflict);holder.innerHTML=`<p style="margin:8px 0;color:#607a8b">Los códigos compartidos necesitan coincidencia de nombre o revisión manual. Si no estás seguro, déjalos pendientes.</p><table class="data-table"><thead><tr><th>Excel: código / nombre</th><th>PVP</th><th>Coincidencia en inventario</th><th>Estado</th></tr></thead><tbody>${rows.map(r=>`<tr><td>${pfSafe(r.code)}<br><b>${pfSafe(r.name)}</b></td><td>${pfMoney(r.price)}</td><td><select data-pf-choice="${r.index}" style="max-width:330px;padding:8px;border-radius:7px;border:1px solid #c1d5dd"><option value="">Pendiente · no actualizar</option>${r.candidates.map(p=>`<option value="${pfSafe(p.id)}" ${r.choice===p.id?'selected':''}>${pfSafe(p.name)} (${pfSafe(p.code)})</option>`).join('')}</select></td><td>${r.conflict?'Conflicto de precios':r.choice?'Aprobado':r.status==='multi'?'Código compartido':'Nombre diferente'}</td></tr>`).join('')}</tbody></table>${!rows.length?'<p>No hay coincidencias pendientes de revisión.</p>':''}`;
 }else{
 const rows=pfReviewRows.filter(r=>r.status==='missing'||r.status==='invalid'||r.status==='no-price');holder.innerHTML=`<table class="data-table"><thead><tr><th>Código</th><th>Nombre en Excel</th><th>Motivo</th></tr></thead><tbody>${rows.slice(0,200).map(r=>`<tr><td>${pfSafe(r.code)}</td><td>${pfSafe(r.name)}</td><td>${r.status==='missing'?'Código no existe en inventario':r.status==='no-price'?'Sin PVP':'Fila inválida'}</td></tr>`).join('')}</tbody></table>${rows.length>200?'<p>Mostrando primeros 200 pendientes.</p>':''}`;
 }
}
async function applyPvp(){
 if(!ready()||!pfPriceRows.length)return;
 const count=pfPriceRows.length;
 if(!confirm('¿Actualizar SOLAMENTE los PVP de '+count+' productos aprobados? Stock, ubicaciones, caducidades y conteos no cambiarán.'))return;
 const btn=$id('pfImportApply'),msg=$id('pfImportProgress');btn.disabled=true;
 let applied=0;
 try{
  for(let i=0;i<pfPriceRows.length;i+=150){
   const batch=fb.fsm.writeBatch(fb.db),chunk=pfPriceRows.slice(i,i+150);
   for(const {product,price} of chunk){
    batch.update(fb.fsm.doc(fb.db,'stock',product.id),{pvp:price,pvpUpdatedAt:new Date().toISOString()});
    batch.set(fb.fsm.doc(fb.db,'service_products',product.id),serviceProjection({...product,pvp:price}));
   }
   await batch.commit();applied+=chunk.length;
   chunk.forEach(({product,price})=>product.pvp=price);
   msg.textContent=`PVP sincronizados: ${applied} de ${count}.`;
  }
  pfPriceRows=[];refreshPvpSelection();renderPvpPreview();
  msg.textContent=`Finalizado: ${applied} precios actualizados. Stock, ubicaciones, conteos y reconteos intactos.`;
 }catch(e){msg.textContent=`Se actualizaron ${applied} precios. Error: ${e.message||e}. Vuelve a cargar el Excel antes de reintentar.`}
}
// Primera publicación del inventario ya existente, sin Cloud Functions.
async function publishInitial(){
 if(!ready())return;const msg=$id('pfSyncStatus')||$id('pfpvpMsg');
 const products=STORE.products.filter(p=>p.id&&p.code&&p.name);
 if(!confirm('Publicar '+products.length+' productos existentes para Atención al Cliente? No cambia conteos ni ubicaciones.'))return;
 try{
  const trigger=$id('pfSyncPublish');if(trigger)trigger.disabled=true;
  for(let i=0;i<products.length;i+=175){
   const b=fb.fsm.writeBatch(fb.db);
   for(const p of products.slice(i,i+175))b.set(fb.fsm.doc(fb.db,'service_products',p.id),serviceProjection(p));
   await b.commit();msg.textContent='Publicados '+Math.min(i+175,products.length)+' de '+products.length+' productos…';
  }
  msg.textContent='Catálogo publicado. Los cambios posteriores de inventario y PVP se publicarán automáticamente.';
 }catch(e){msg.textContent='Publicación incompleta: '+(e.message||e)}finally{const trigger=$id('pfSyncPublish');if(trigger)trigger.disabled=false}
}

// Venta fraccionada: habilitación explícita, nunca inferida automáticamente del nombre.
function pfFractionDialog(){
 let modal=$id('pfFractionDialog');if(modal)return modal;
 modal=document.createElement('div');modal.id='pfFractionDialog';modal.style.cssText='display:none;position:fixed;inset:0;z-index:116;background:#182d42aa;padding:18px;overflow:auto';
 modal.innerHTML=`<section style="max-width:820px;margin:3vh auto;background:white;border-radius:18px;padding:22px;color:#15334a"><header style="display:flex;justify-content:space-between;gap:12px;align-items:center"><h2>Venta por unidad · Supervisión</h2><button type="button" id="pfFractionClose" class="btn btn-outline">Cerrar</button></header><input id="pfFractionSearch" class="input" placeholder="Buscar código o nombre" style="margin:14px 0;width:100%"><div id="pfFractionList" style="max-height:54vh;overflow:auto"></div><div id="pfFractionEdit" style="display:none;border-top:1px solid #d8e8f0;padding-top:14px;margin-top:10px"></div><p id="pfFractionMessage" role="status" style="font-size:12px;color:#3e6b82;margin-top:10px"></p></section>`;
 document.body.appendChild(modal);
 $id('pfFractionClose').onclick=()=>modal.style.display='none';
 $id('pfFractionSearch').oninput=pfFractionSearch;
 modal.addEventListener('click',e=>{const b=e.target.closest('[data-fraction-id]');if(b)pfFractionSelect(b.dataset.fractionId)});
 return modal;
}
function pfFractionOpen(){if(!ready())return;pfFractionDialog().style.display='block';$id('pfFractionSearch').value='';$id('pfFractionEdit').style.display='none';pfFractionSearch()}
function pfFractionSearch(){const q=($id('pfFractionSearch').value||'').toLocaleUpperCase().trim();const rows=STORE.products.filter(p=>!q||String(p.code||'').toUpperCase().includes(q)||String(p.name||'').toUpperCase().includes(q)).slice(0,45);$id('pfFractionList').innerHTML=rows.map(p=>`<button type="button" data-fraction-id="${escapeHtml(p.id)}" style="width:100%;padding:10px;border:0;border-bottom:1px solid #e1edf2;background:#fff;text-align:left;cursor:pointer"><b>${escapeHtml(p.name||'')}</b><small style="display:block;color:#67869a">${escapeHtml(p.code||'')} · ${p.fractionAllowed?'Fraccionado':'Venta completa'}</small></button>`).join('')||'<p>Sin productos.</p>'}
function pfFractionSelect(id){const p=STORE.products.find(x=>x.id===id);if(!p)return;const box=$id('pfFractionEdit');box.style.display='block';const price=p.pvp==null?'PVP pendiente':'$'+Number(p.pvp).toFixed(2);const units=Number(p.fractionUnits||0);const override=p.fractionOverride===true;box.innerHTML=`<b>${escapeHtml(p.name||'')}</b><p style="margin:6px 0 10px;color:#55798c">PVP presentación: ${price}. Sin cambios en stock ni ubicaciones.</p><label style="display:block;margin-bottom:9px"><input type="checkbox" id="pfFractionAllowed" ${p.fractionAllowed?'checked':''}> Permitir venta fraccionada (confirmada por Supervisión)</label><label style="display:block;margin-bottom:9px">Unidades por presentación <input id="pfFractionUnits" type="number" min="1" max="10000" step="1" value="${units||''}" class="input" style="max-width:180px"></label><label style="display:block;margin-bottom:9px"><input type="checkbox" id="pfFractionOverride" ${override?'checked':''}> Establecer precio por unidad manualmente</label><label style="display:block;margin-bottom:9px">PVP unitario manual ($) <input id="pfFractionPrice" type="number" min="0.01" max="999999" step="0.01" value="${override&&p.fractionPvp!=null?Number(p.fractionPvp).toFixed(2):''}" class="input" style="max-width:180px"></label><p id="pfFractionPreview" style="color:#126288;font-weight:700;margin:8px 0"></p><button id="pfFractionSave" type="button" class="btn btn-primary">Guardar venta por unidad</button>`;
 const update=()=>{const allow=$id('pfFractionAllowed').checked,n=Number($id('pfFractionUnits').value),manual=$id('pfFractionOverride').checked,full=Number(p.pvp);$id('pfFractionPrice').disabled=!manual;const auto=Number.isInteger(n)&&n>0&&Number.isFinite(full)&&full>0?Math.round((full/n)*100)/100:null;$id('pfFractionPreview').textContent=!allow?'Venta fraccionada deshabilitada':manual?'Precio unitario manual: $'+(Number($id('pfFractionPrice').value)||0).toFixed(2):auto!==null?'Precio unitario calculado: $'+auto.toFixed(2):'Para calcular, registra PVP presentación y unidades válidas.'};
 box.querySelectorAll('input').forEach(el=>el.addEventListener('input',update));box.querySelectorAll('input[type=checkbox]').forEach(el=>el.addEventListener('change',update));update();
 $id('pfFractionSave').onclick=async()=>{const allow=$id('pfFractionAllowed').checked,n=Number($id('pfFractionUnits').value),manual=$id('pfFractionOverride').checked,unit=Number($id('pfFractionPrice').value);if(allow&&(!Number.isSafeInteger(n)||n<1||n>10000)){$id('pfFractionMessage').textContent='Indica cuántas unidades tiene la presentación.';return}if(allow&&manual&&(!Number.isFinite(unit)||unit<=0||unit>999999)){$id('pfFractionMessage').textContent='Indica un PVP unitario válido.';return}if(allow&&!manual&&!(Number(p.pvp)>0)){$id('pfFractionMessage').textContent='Primero registra el PVP de la presentación.';return}const data={fractionAllowed:allow,fractionUnits:allow?n:0,fractionOverride:allow&&manual,fractionPvp:allow&&manual?Math.round(unit*100)/100:null};const btn=$id('pfFractionSave');btn.disabled=true;$id('pfFractionMessage').textContent='Guardando…';try{const b=fb.fsm.writeBatch(fb.db);b.update(fb.fsm.doc(fb.db,'stock',id),data);b.set(fb.fsm.doc(fb.db,'service_products',id),{...data,updatedAt:new Date().toISOString()},{merge:true});await b.commit();Object.assign(p,data);$id('pfFractionMessage').textContent='Precio fraccionado guardado y sincronizado.';pfFractionSearch();}catch(e){$id('pfFractionMessage').textContent='Error al guardar: '+String(e.message||e)}finally{btn.disabled=false}};
}

ensure();
document.addEventListener('click',e=>{
 if(e.target.closest('[data-fraction-open]')){pfFractionOpen();return;}
 const open=e.target.closest('[data-pf-open]');
 if(open){show();return;}
 const pvpImport=e.target.closest('[data-pf-import-pvp]');
 if(pvpImport){openPvpImport();return;}
 const publish=e.target.closest('[data-pf-publish]');
 if(publish){publishInitial();return;}
});
})();
})();
